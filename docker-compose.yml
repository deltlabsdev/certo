services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: certo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d certo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: certo
      DATABASE_USERNAME: ${POSTGRES_USER:-certo}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      APP_KEYS: ${APP_KEYS:?}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      FRONTEND_URL: ${FRONTEND_URL:?}   # e.g. https://badges.example.com
      PUBLIC_URL: ${PUBLIC_URL:?}       # e.g. https://api.badges.example.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - uploads-data:/app/public/uploads

  frontend:
    build:
      context: ./src/frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_URL: ${PUBLIC_URL:?}

volumes:
  postgres-data:
  uploads-data:
